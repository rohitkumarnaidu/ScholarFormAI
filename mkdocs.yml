site_name: ScholarFormAI Enterprise Documentation
site_description: Enterprise documentation for ScholarFormAI.
site_url: https://scholarformai.example.com
theme:
  name: material
  features:
  - navigation.tabs
  - navigation.sections
  - navigation.expand
  - search.suggest
  - search.highlight
  - content.code.copy
  - content.code.annotate
  palette:
  - scheme: default
    primary: indigo
    accent: indigo
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  - scheme: slate
    primary: indigo
    accent: indigo
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
plugins:
- search
markdown_extensions:
- pymdownx.highlight
- pymdownx.superfences
- pymdownx.inlinehilite
- pymdownx.snippets
- pymdownx.details
- pymdownx.tabbed
- admonition
- tables
- toc
nav:
- Home: index.md
- Getting Started:
  - Quickstart: user-guide/quickstart.md
  - User Guide: user-guide/Getting Started.md
  - LLM Setup: user-guide/LLM_PROVIDER_GUIDE.md
  - Developer Onboarding: developer-guide/DEVELOPER_ONBOARDING.md
- Guides:
  - Custom Templates: guides/creating-a-custom-template.md
  - Production Deployment: guides/deploying-to-production.md
  - Monitoring Setup: guides/setting-up-monitoring.md
  - Style Guide: guides/STYLE_GUIDE.md
  - Testing Guide: guides/TESTING.md
  - Python SDK: sdk/SDK_GUIDE.md
  - Plugin Guide: sdk/PLUGIN_GUIDE.md
- Tutorials:
  - Format Your First Paper: tutorials/format-your-first-paper.md
  - Generate Document with AI: tutorials/generate-document-with-ai.md
  - Multi-Document Synthesis: tutorials/multi-doc-synthesis.md
- Architecture:
  - Architecture Overview: architecture/ARCHITECTURE.md
  - System Design: architecture/SYSTEM_DESIGN.md
  - AI Architecture: architecture/AI_ARCHITECTURE.md
  - RAG Architecture: architecture/CHROMA_RAG_ARCHITECTURE.md
  - Frontend Architecture: architecture/FRONTEND_ARCHITECTURE.md
  - Realtime Architecture: architecture/REALTIME_ARCHITECTURE.md
  - Security Architecture: architecture/SECURITY_ARCHITECTURE.md
  - Database Architecture: architecture/DATABASE_ARCHITECTURE.md
  - Data Flow: architecture/Data Flow Architecture.md
- Backend:
