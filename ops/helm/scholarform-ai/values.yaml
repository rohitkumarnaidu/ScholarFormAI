replicaCount: 2

image:
  repository: ghcr.io/scholarform/backend
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 80

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 256Mi

ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: api.scholarform.local
      paths:
        - path: /
          pathType: Prefix
