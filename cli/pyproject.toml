[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amf-cli"
version = "1.0.0"
description = "Automated Manuscript Formatter - CLI tool"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "AMF Team", email = "team@amf.dev"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup",
    "Topic :: Education",
]
keywords = ["academic", "manuscript", "formatting", "cli", "apa", "mla", "docx"]
dependencies = [
    "click>=8.1.0",
    "rich>=13.8.0",
    "requests>=2.32.0",
    "pyyaml>=6.0.0",
    "watchdog>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]
local = [
    "python-docx>=1.1.2",
    "amf-backend",
]

[project.scripts]
amf = "amf.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["amf*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
