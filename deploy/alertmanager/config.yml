# Template — copy to your deployment and replace the placeholder values.

route:
  receiver: "default"
  group_by: ["alertname", "severity", "job"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 24h
  routes:
    - match:
        severity: critical
      receiver: "critical"
      repeat_interval: 4h

receivers:
  - name: "default"
    slack_configs:
      - api_url: "***REMOVED***"
        channel: "#alerts"
        send_resolved: true
        title: "{{ .GroupLabels.alertname }} [{{ .GroupLabels.severity }}]"
        text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"

  - name: "critical"
    slack_configs:
      - api_url: "***REMOVED***"
        channel: "#alerts"
        send_resolved: true
        title: "{{ .GroupLabels.alertname }} [CRITICAL]"
        text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"
    pagerduty_configs:
      - routing_key: "YOUR_PAGERDUTY_ROUTING_KEY"
        severity: "critical"
        description: "{{ .GroupLabels.alertname }} - {{ .GroupLabels.job }}"
