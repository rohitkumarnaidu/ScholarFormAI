<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 820" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3B82F6"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22C55E"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="820" fill="#F8FAFC" rx="12"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#1E293B">Frontend Component Architecture (Next.js 16 App Router)</text>

  <!-- ============================================ -->
  <!-- Context Providers -->
  <rect x="30" y="55" width="840" height="65" rx="10" fill="#F0F9FF" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6,3" filter="url(#shadow)"/>
  <text x="450" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#0369A1">Context Providers (wraps entire app tree)</text>
  <text x="450" y="95" text-anchor="middle" font-size="10" fill="#0284C7">AuthProvider · ThemeProvider · SettingsProvider</text>
  <text x="450" y="110" text-anchor="middle" font-size="10" fill="#0284C7">FeatureFlagProvider · SubscriptionProvider</text>

  <!-- Arrow from Providers down to Layouts -->
  <line x1="450" y1="120" x2="450" y2="150" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- ============================================ -->
  <!-- Root Layout -->
  <rect x="30" y="155" width="840" height="65" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="178" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A8A">app/layout.jsx — Root Layout</text>
  <text x="450" y="195" text-anchor="middle" font-size="10" fill="#2563EB">HTML shell · Metadata · Fonts · Global CSS</text>
  <text x="450" y="210" text-anchor="middle" font-size="10" fill="#2563EB">Navigation (Header + Footer)</text>

  <!-- Root Layout → Route Groups -->
  <line x1="450" y1="220" x2="450" y2="250" stroke="#3B82F6" stroke-width="2"/>
  <line x1="450" y1="250" x2="150" y2="250" stroke="#3B82F6" stroke-width="2"/>
  <line x1="450" y1="250" x2="450" y2="250" stroke="#3B82F6" stroke-width="2"/>
  <line x1="450" y1="250" x2="750" y2="250" stroke="#3B82F6" stroke-width="2"/>
  <line x1="150" y1="250" x2="150" y2="270" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="450" y1="250" x2="450" y2="270" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="750" y1="250" x2="750" y2="270" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- ============================================ -->
  <!-- Route Groups -->
  <!-- Shared -->
  <rect x="30" y="275" width="240" height="55" rx="8" fill="#DBEAFE" stroke="#60A5FA" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="150" y="298" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A8A">(shared) Route Group</text>
  <text x="150" y="316" text-anchor="middle" font-size="10" fill="#2563EB">Dashboard · Settings · Profile</text>

  <!-- Formatter -->
  <rect x="290" y="275" width="320" height="55" rx="8" fill="#DBEAFE" stroke="#60A5FA" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="298" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A8A">(formatter) Route Group</text>
  <text x="450" y="316" text-anchor="middle" font-size="10" fill="#2563EB">Upload · Preview · Compare · Edit · Download</text>

  <!-- Generator -->
  <rect x="630" y="275" width="240" height="55" rx="8" fill="#DBEAFE" stroke="#60A5FA" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="750" y="298" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A8A">(generator) Route Group</text>
  <text x="750" y="316" text-anchor="middle" font-size="10" fill="#2563EB">Sessions · Multi-Doc · Agent</text>

  <!-- Arrows to page components -->
  <line x1="150" y1="330" x2="150" y2="360" stroke="#60A5FA" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <line x1="450" y1="330" x2="450" y2="360" stroke="#60A5FA" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <line x1="750" y1="330" x2="750" y2="360" stroke="#60A5FA" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <!-- ============================================ -->
  <!-- Page Components -->
  <rect x="30" y="365" width="240" height="80" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="150" y="388" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">Page Components (Shared)</text>
  <text x="150" y="405" text-anchor="middle" font-size="10" fill="#64748B">DashboardPage · SettingsPage</text>
  <text x="150" y="420" text-anchor="middle" font-size="10" fill="#64748B">ProfilePage · BillingPage</text>
  <text x="150" y="435" text-anchor="middle" font-size="10" fill="#64748B">ApiKeysPage</text>

  <rect x="290" y="365" width="320" height="80" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="450" y="388" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">Page Components (Formatter)</text>
  <text x="450" y="405" text-anchor="middle" font-size="10" fill="#64748B">UploadPage · PreviewPage · EditPage</text>
  <text x="450" y="420" text-anchor="middle" font-size="10" fill="#64748B">ComparePage · DownloadPage</text>
  <text x="450" y="435" text-anchor="middle" font-size="10" fill="#64748B">DocumentStatusPage</text>

  <rect x="630" y="365" width="240" height="80" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="750" y="388" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">Page Components (Generator)</text>
  <text x="750" y="405" text-anchor="middle" font-size="10" fill="#64748B">SessionsPage · SessionPage</text>
  <text x="750" y="420" text-anchor="middle" font-size="10" fill="#64748B">MultiDocPage · AgentPage</text>
  <text x="750" y="435" text-anchor="middle" font-size="10" fill="#64748B">OutlineApprovePage</text>

  <!-- Shared UI components label -->
  <rect x="30" y="470" width="840" height="140" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4" filter="url(#shadow)"/>
  <text x="450" y="495" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Shared UI Components</text>

  <!-- Shared UI component boxes -->
  <rect x="50" y="510" width="120" height="40" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="110" y="534" text-anchor="middle" font-size="10" fill="#475569">Navbar</text>

  <rect x="185" y="510" width="120" height="40" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="245" y="534" text-anchor="middle" font-size="10" fill="#475569">Sidebar</text>

  <rect x="320" y="510" width="120" height="40" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="380" y="534" text-anchor="middle" font-size="10" fill="#475569">FileUploadZone</text>

  <rect x="455" y="510" width="120" height="40" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="515" y="534" text-anchor="middle" font-size="10" fill="#475569">PreviewPane</text>

  <rect x="590" y="510" width="120" height="40" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="650" y="534" text-anchor="middle" font-size="10" fill="#475569">TemplatePicker</text>

  <rect x="725" y="510" width="120" height="40" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="785" y="534" text-anchor="middle" font-size="10" fill="#475569">ProgressBar</text>

  <rect x="50" y="560" width="120" height="38" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="110" y="583" text-anchor="middle" font-size="10" fill="#475569">ResultsList</text>

  <rect x="185" y="560" width="120" height="38" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="245" y="583" text-anchor="middle" font-size="10" fill="#475569">FormatOptions</text>

  <rect x="320" y="560" width="120" height="38" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="380" y="583" text-anchor="middle" font-size="10" fill="#475569">DiffViewer</text>

  <rect x="455" y="560" width="120" height="38" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="515" y="583" text-anchor="middle" font-size="10" fill="#475569">SessionTimeline</text>

  <rect x="590" y="560" width="120" height="38" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="650" y="583" text-anchor="middle" font-size="10" fill="#475569">SuggestionDrawer</text>

  <rect x="725" y="560" width="120" height="38" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="785" y="583" text-anchor="middle" font-size="10" fill="#475569">Toast / Notif.</text>

  <!-- Arrow: Pages → Shared UI -->
  <line x1="450" y1="445" x2="450" y2="470" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <!-- ============================================ -->
  <!-- Service Layer -->
  <rect x="30" y="635" width="840" height="70" rx="10" fill="#ECFDF5" stroke="#22C55E" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="658" text-anchor="middle" font-size="13" font-weight="700" fill="#14532D">Service Layer — lib/api.js (API Client)</text>
  <text x="450" y="677" text-anchor="middle" font-size="10" fill="#166534">fetchClient · authFetch · SSE Stream · WebSocket Connection</text>
  <text x="450" y="694" text-anchor="middle" font-size="10" fill="#166534">Error Handling · Request Retry · Idempotency Headers</text>

  <!-- Arrow: Pages → Service Layer -->
  <line x1="450" y1="610" x2="450" y2="635" stroke="#22C55E" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- ============================================ -->
  <!-- Backend API -->
  <rect x="30" y="730" width="840" height="65" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="754" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A8A">FastAPI Backend — /api/v1/*</text>
  <text x="450" y="772" text-anchor="middle" font-size="10" fill="#2563EB">Health · Auth · Documents · Templates · Generator</text>
  <text x="450" y="787" text-anchor="middle" font-size="10" fill="#2563EB">Synthesis · Feedback · Metrics · Providers · Billing · Stream</text>

  <!-- Arrow: Service → Backend -->
  <line x1="450" y1="705" x2="450" y2="730" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowBlue)"/>
</svg>
