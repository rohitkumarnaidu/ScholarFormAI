name: "Stale Issue and PR Management"

on:
  schedule:
    - cron: "0 6 * * 1-5"  # Weekdays at 6:00 UTC

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stale:
    name: Close stale issues and PRs
    runs-on: ubuntu-latest

    steps:
      - name: Mark and close stale items
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # Issue settings
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had
            recent activity. It will be closed in 14 days if no further activity occurs.
            If this is still relevant, please comment to keep it open.
          close-issue-message: >
            This issue has been automatically closed due to inactivity.
            Feel free to reopen if the issue persists or is still relevant.
          stale-issue-label: "stale"
          close-issue-label: "auto-closed"
          exempt-issue-labels: "security,pinned,roadmap"

          # PR settings
          days-before-pr-stale: 60
          days-before-pr-close: 14
          stale-pr-message: >
            This pull request has been automatically marked as stale because it has not
            had recent activity. It will be closed in 14 days if no further activity occurs.
            If this is still being worked on, please update and comment to keep it open.
          close-pr-message: >
            This pull request has been automatically closed due to inactivity.
            Feel free to reopen if you plan to continue working on it.
          stale-pr-label: "stale"
          close-pr-label: "auto-closed"
          exempt-pr-labels: "security,pinned,roadmap,wip"

          # General settings
          ascending: true
          operations-per-run: 100
          remove-stale-when-updated: true
          debug-only: false
