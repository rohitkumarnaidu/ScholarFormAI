name: deploy-production

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Frontend CI"]
    branches: [main]
    types: [completed]

permissions:
  contents: read

jobs:
  verify-ci-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve commit SHA
        id: sha
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const sha = context.payload.workflow_run?.head_sha || context.sha;
            core.info(`Target commit: ${sha}`);
            core.setOutput('sha', sha);

      - name: Verify required CI workflows passed for this commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const sha = '${{ steps.sha.outputs.sha }}';
            const requiredWorkflows = ['backend-ci.yml', 'frontend-ci.yml', 'security.yml'];
            let allPassed = true;

            for (const workflow of requiredWorkflows) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflow,
                head_sha: sha,
                per_page: 1
              });

              if (data.workflow_runs.length === 0) {
                core.info(`${workflow}: no run for this commit (path filter excluded) — OK`);
              } else {
                const run = data.workflow_runs[0];
                const conclusion = run.conclusion;
                core.info(`${workflow}: run #${run.run_number} — ${conclusion}`);
                if (conclusion !== 'success') {
                  core.setFailed(`${workflow} failed (${conclusion}) for commit ${sha}. Deploy blocked.`);
                  allPassed = false;
                }
              }
            }

            if (allPassed) {
              core.info('All required CI workflows passed. Proceeding with deploy.');
            }

      - name: Check triggering workflow branch
        if: github.event_name == 'workflow_run'
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          if [ "$BRANCH" != "main" ]; then
            echo "Triggered by branch $BRANCH, not main. Skipping production deploy."
            exit 1
          fi
          echo "Triggered by main branch. Proceeding."

  pre-deploy-health:
    runs-on: ubuntu-latest
    needs: verify-ci-gates
    environment: production
    steps:
      - name: Pre-deployment health check
        env:
          PROD_BACKEND_URL: ${{ secrets.PROD_BACKEND_URL || vars.PROD_BACKEND_URL }}
        run: |
          echo "Running pre-deployment health check..."
          STATUS=$(curl -L -sS --connect-timeout 5 --max-time 10 -o /dev/null -w "%{http_code}" "${PROD_BACKEND_URL}/api/v1/health/live")
          echo "Current production health: HTTP $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "Production is healthy, proceeding with deploy."
          else
            echo "::warning::Production health check returned HTTP $STATUS. Proceeding with caution."
          fi

  deploy-production:
    runs-on: ubuntu-latest
    needs: [verify-ci-gates, pre-deploy-health]
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Validate deploy secrets
        id: preflight
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY || vars.RENDER_API_KEY }}
          RENDER_PROD_SERVICE_ID: ${{ secrets.RENDER_PROD_SERVICE_ID || vars.RENDER_PROD_SERVICE_ID }}
          RENDER_PROD_DEPLOY_HOOK_URL: ${{ secrets.RENDER_PROD_DEPLOY_HOOK_URL || vars.RENDER_PROD_DEPLOY_HOOK_URL }}
          PROD_BACKEND_URL: ${{ secrets.PROD_BACKEND_URL || vars.PROD_BACKEND_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || vars.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID }}
          VERCEL_PROD_PROJECT_ID: ${{ secrets.VERCEL_PROD_PROJECT_ID || vars.VERCEL_PROD_PROJECT_ID }}
        run: |
          missing=()
          [ -z "${PROD_BACKEND_URL}" ] && missing+=("PROD_BACKEND_URL")
          [ -z "${VERCEL_TOKEN}" ] && missing+=("VERCEL_TOKEN")
          [ -z "${VERCEL_ORG_ID}" ] && missing+=("VERCEL_ORG_ID")
          [ -z "${VERCEL_PROD_PROJECT_ID}" ] && missing+=("VERCEL_PROD_PROJECT_ID")

          deploy_mode=""
          if [ -n "${RENDER_PROD_DEPLOY_HOOK_URL}" ]; then
            deploy_mode="hook"
          elif [ -n "${RENDER_API_KEY}" ] && [ -n "${RENDER_PROD_SERVICE_ID}" ]; then
            if [[ "${RENDER_PROD_SERVICE_ID}" =~ ^srv- ]]; then
              deploy_mode="api"
            else
              missing+=("RENDER_PROD_SERVICE_ID (must start with srv-)")
            fi
          else
            missing+=("RENDER_PROD_DEPLOY_HOOK_URL or (RENDER_API_KEY + RENDER_PROD_SERVICE_ID)")
          fi

          if [ ${#missing[@]} -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "missing=${missing[*]}" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping production deploy. Missing secrets: ${missing[*]}"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "deploy_mode=${deploy_mode}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Render service exists
        if: steps.preflight.outputs.ready == 'true' && steps.preflight.outputs.deploy_mode == 'api'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY || vars.RENDER_API_KEY }}
          RENDER_PROD_SERVICE_ID: ${{ secrets.RENDER_PROD_SERVICE_ID || vars.RENDER_PROD_SERVICE_ID }}
        run: |
          echo "Checking Render service ${RENDER_PROD_SERVICE_ID} exists..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            "https://api.render.com/v1/services/${RENDER_PROD_SERVICE_ID}" \
            -H "Accept: application/json" \
            -H "Authorization: Bearer ${RENDER_API_KEY}")
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d: -f2)
          if [[ "$HTTP_STATUS" != "200" ]]; then
            echo "Render service ${RENDER_PROD_SERVICE_ID} not found (HTTP $HTTP_STATUS)."
            exit 1
          fi
          SERVICE_NAME=$(echo "$RESPONSE" | grep -v "HTTP_STATUS" | python3 -c "import sys,json; print(json.load(sys.stdin).get('service','').get('name','unknown'))" 2>/dev/null || echo "unknown")
          echo "Render service '${SERVICE_NAME}' (${RENDER_PROD_SERVICE_ID}) exists."

      - name: Verify Vercel project exists
        if: steps.preflight.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || vars.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID }}
          VERCEL_PROD_PROJECT_ID: ${{ secrets.VERCEL_PROD_PROJECT_ID || vars.VERCEL_PROD_PROJECT_ID }}
        run: |
          echo "Checking Vercel project ${VERCEL_PROD_PROJECT_ID} exists..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            "https://api.vercel.com/v9/projects/${VERCEL_PROD_PROJECT_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}")
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d: -f2)
          if [[ "$HTTP_STATUS" != "200" ]]; then
            echo "Vercel project ${VERCEL_PROD_PROJECT_ID} not found (HTTP $HTTP_STATUS)."
            exit 1
          fi
          PROJECT_NAME=$(echo "$RESPONSE" | grep -v "HTTP_STATUS" | python3 -c "import sys,json; print(json.load(sys.stdin).get('name','unknown'))" 2>/dev/null || echo "unknown")
          echo "Vercel project '${PROJECT_NAME}' (${VERCEL_PROD_PROJECT_ID}) exists."

      - name: Run database migrations
        if: steps.preflight.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd backend
          pip install -r requirements-render.txt
          alembic upgrade head

      - name: Deploy backend to Render (Deploy Hook)
        id: deploy
        if: steps.preflight.outputs.ready == 'true' && steps.preflight.outputs.deploy_mode == 'hook'
        env:
          RENDER_PROD_DEPLOY_HOOK_URL: ${{ secrets.RENDER_PROD_DEPLOY_HOOK_URL || vars.RENDER_PROD_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering backend deploy via Render deploy hook..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${RENDER_PROD_DEPLOY_HOOK_URL}")
          echo "Status: $HTTP_STATUS"
          if [[ "$HTTP_STATUS" != 2* ]]; then
            echo "Deploy hook returned HTTP $HTTP_STATUS. Check RENDER_PROD_DEPLOY_HOOK_URL."
            exit 1
          fi
          echo "Deploy hook triggered successfully."

      - name: Deploy backend to Render
        id: deploy-api
        if: steps.preflight.outputs.ready == 'true' && steps.preflight.outputs.deploy_mode == 'api'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY || vars.RENDER_API_KEY }}
          RENDER_PROD_SERVICE_ID: ${{ secrets.RENDER_PROD_SERVICE_ID || vars.RENDER_PROD_SERVICE_ID }}
        run: |
          echo "Triggering deploy for service: ${RENDER_PROD_SERVICE_ID}"
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "https://api.render.com/v1/services/${RENDER_PROD_SERVICE_ID}/deploys" \
            -H "Accept: application/json" \
            -H "Authorization: Bearer ${RENDER_API_KEY}")
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS")
          echo "Status: $HTTP_STATUS"
          echo "Response: $BODY"
          if [[ "$HTTP_STATUS" != 2* ]]; then
            echo "Deploy API returned HTTP $HTTP_STATUS. Check RENDER_API_KEY and RENDER_PROD_SERVICE_ID secrets."
            exit 1
          fi
          echo "Deploy triggered successfully."

      - name: Wait for backend health
        if: steps.preflight.outputs.ready == 'true'
        env:
          PROD_BACKEND_URL: ${{ secrets.PROD_BACKEND_URL || vars.PROD_BACKEND_URL }}
        run: |
          echo "Waiting for backend at ${PROD_BACKEND_URL}..."
          for i in {1..20}; do
            STATUS=$(curl -L -sS --connect-timeout 5 --max-time 10 -o /dev/null -w "%{http_code}" "${PROD_BACKEND_URL}/api/v1/health/live")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Backend is healthy."
              exit 0
            fi
            sleep 15
          done
          echo "Backend health check timed out."
          exit 1

      - name: Post-deployment verification
        if: steps.preflight.outputs.ready == 'true'
        env:
          PROD_BACKEND_URL: ${{ secrets.PROD_BACKEND_URL || vars.PROD_BACKEND_URL }}
        run: |
          echo "Running post-deployment verification..."
          STATUS=$(curl -L -sS --connect-timeout 5 --max-time 10 -o /dev/null -w "%{http_code}" "${PROD_BACKEND_URL}/api/v1/health/live")
          if [ "$STATUS" != "200" ]; then
            echo "Post-deployment health check failed with HTTP $STATUS"
            exit 1
          fi
          echo "Post-deployment verification passed."

      - name: Auto-rollback on health check failure
        if: failure() && (steps.deploy.outcome == 'success' || steps.deploy-api.outcome == 'success')
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY || vars.RENDER_API_KEY }}
          RENDER_PROD_SERVICE_ID: ${{ secrets.RENDER_PROD_SERVICE_ID || vars.RENDER_PROD_SERVICE_ID }}
        run: |
          echo "Health check failed, initiating rollback..."
          DEPLOY_ID="${{ steps.deploy.outputs.deploy_id || steps.deploy-api.outputs.deploy_id }}"
          curl -X POST "https://api.render.com/v1/services/${RENDER_PROD_SERVICE_ID}/deploys/${DEPLOY_ID}/rollback" \
            -H "Authorization: Bearer ${RENDER_API_KEY}"

      - name: Deploy frontend to Vercel
        if: steps.preflight.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || vars.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID }}
          VERCEL_PROD_PROJECT_ID: ${{ secrets.VERCEL_PROD_PROJECT_ID || vars.VERCEL_PROD_PROJECT_ID }}
        run: |
          npx vercel@latest --version
          VERCEL_ORG_ID=${VERCEL_ORG_ID} VERCEL_PROJECT_ID=${VERCEL_PROD_PROJECT_ID} \
            npx vercel@latest deploy --prod --yes --token ${VERCEL_TOKEN}

      - name: Deployment skipped
        if: steps.preflight.outputs.ready != 'true'
        run: |
          echo "Production deploy skipped because required secrets are not configured."
          echo "Missing: ${{ steps.preflight.outputs.missing }}"
