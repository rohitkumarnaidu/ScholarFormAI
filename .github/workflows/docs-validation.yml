name: Documentation Validation

on:
  push:
    branches: [ main, develop ]
    paths:
      - '**/*.md'
      - 'mkdocs.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - '**/*.md'
      - 'mkdocs.yml'

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Run markdownlint
        run: markdownlint '**/*.md' --ignore node_modules --ignore venv --ignore .git

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MkDocs and Plugins
        run: |
          pip install mkdocs mkdocs-material

      - name: Validate MkDocs Build
        # Strict mode is temporarily disabled due to 17,000+ legacy dead links to source code.
        # Future phases will systematically resolve these links.
        run: mkdocs build
