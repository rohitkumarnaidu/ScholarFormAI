site_name: ScholarFormAI Enterprise Documentation
site_description: Enterprise documentation for ScholarFormAI.
site_url: https://scholarformai.example.com
theme:
  name: material
  features:
  - navigation.tabs
  - navigation.sections
  - navigation.expand
  - search.suggest
  - search.highlight
  - content.code.copy
  - content.code.annotate
  palette:
  - scheme: default
    primary: indigo
    accent: indigo
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  - scheme: slate
    primary: indigo
    accent: indigo
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
plugins:
- search
markdown_extensions:
- pymdownx.highlight
- pymdownx.superfences
- pymdownx.inlinehilite
- pymdownx.snippets
- pymdownx.details
- pymdownx.tabbed
- admonition
- tables
- toc
nav:
- Home: README.md
- Getting Started:
  - Quickstart: docs/guides/USER_GUIDE.md
  - Installation: docs/getting-started/installation.md
  - Configuration: docs/operations/CONFIGURATION.md
- Guides:
