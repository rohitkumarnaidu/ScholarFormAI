sonar.projectKey=amf_automated-manuscript-formatter
sonar.organization=amf
sonar.projectName=Automated Manuscript Formatter
sonar.projectVersion=1.0.0

sonar.sources=backend/app,frontend/src,cli/amf,sdk/amf_sdk
sonar.exclusions=**/__pycache__/**,**/node_modules/**,**/dist/**,**/build/**,**/.venv/**,**/migrations/**,**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx

sonar.tests=backend/tests,cli/tests,sdk/tests,frontend/src
sonar.test.inclusions=**/test_*.py,**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx
sonar.test.exclusions=**/node_modules/**,**/dist/**,**/__pycache__/**

sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

sonar.sourceEncoding=UTF-8

sonar.python.version=3.12

sonar.language=py
sonar.dynamicAnalysis=reuseReports

sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

sonar.verbose=false

sonar.cpd.exclusions=**/tests/**,**/migrations/**,**/node_modules/**,**/*.json

sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S107
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.py
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.e2.resourceKey=**/app/services/formatter.py
