name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Python packages
        run: |
          pip install build twine
          for dir in backend cli sdk; do
            cd $dir && python -m build && cd ..
          done

      - name: Build Docker images
        run: |
          docker compose build
          docker tag amf-backend:latest ghcr.io/${{ github.repository }}/backend:${{ github.ref_name }}
          docker tag amf-frontend:latest ghcr.io/${{ github.repository }}/frontend:${{ github.ref_name }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker images
        run: |
          docker push ghcr.io/${{ github.repository }}/backend:${{ github.ref_name }}
          docker push ghcr.io/${{ github.repository }}/frontend:${{ github.ref_name }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            backend/dist/*
            cli/dist/*
            sdk/dist/*
