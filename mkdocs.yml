site_name: ScholarFormAI Enterprise Documentation
site_description: Enterprise documentation for ScholarFormAI.
site_url: https://scholarformai.example.com
theme:
  name: material
  features:
  - navigation.tabs
  - navigation.sections
  - navigation.expand
  - search.suggest
  - search.highlight
  - content.code.copy
  - content.code.annotate
  palette:
  - scheme: default
    primary: indigo
    accent: indigo
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  - scheme: slate
    primary: indigo
    accent: indigo
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
plugins:
- search
markdown_extensions:
- pymdownx.highlight
- pymdownx.superfences
- pymdownx.inlinehilite
- pymdownx.snippets
- pymdownx.details
- pymdownx.tabbed
- admonition
- tables
- toc
nav:
- Home: README.md
- Guides:
  - Developer Guide: guides/DEVELOPER_GUIDE.md
- Examples:
  - React Integration: examples/sample-projects/react-integration/README.md
  - Python CLI Starter: examples/starter-kits/python-cli/README.md
  - Cookbook: examples/cookbook/README.md
  - Best Practices: examples/best-practices/README.md
- Reference:
  - Contributing: CONTRIBUTING.md
  - Code of Conduct: CODE_OF_CONDUCT.md
  - Security: SECURITY.md
  - Support: SUPPORT.md
  - Roadmap: ROADMAP.md
  - Changelog: CHANGELOG.md
  - Governance: GOVERNANCE.md
  - Maintainers: MAINTAINERS.md
  - License: LICENSE
  - Privacy: PRIVACY.md
  - Terms: TERMS.md
  - Accessibility: ACCESSIBILITY.md
- Architecture:
  - Architecture Overview: architecture/ARCHITECTURE.md
  - System Design: architecture/SYSTEM_DESIGN.md
  - AI Architecture: ai/AI.md
  - Agents: ai/AGENTS.md
  - Memory: ai/MEMORY.md
  - RAG: ai/RAG.md
  - Database: database/DATABASE.md
  - Authentication: security/AUTHENTICATION.md
  - Authorization: security/AUTHORIZATION.md
- API Docs:
  - API Reference: api/API_REFERENCE.md
- Deployment:
  - Deployment Guide: operations/DEPLOYMENT.md
  - Operations: operations/OPERATIONS.md
  - Monitoring: operations/MONITORING.md
  - Observability: operations/OBSERVABILITY.md
  - Performance: operations/PERFORMANCE.md
  - Benchmarks: operations/BENCHMARKS.md
