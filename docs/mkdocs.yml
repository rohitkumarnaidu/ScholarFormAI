site_name: "ScholarFormAI — Automated Manuscript Formatter"
site_description: Enterprise-grade formatting of academic manuscripts into professionally styled DOCX documents
site_url: https://rohitkumarnaidu.github.io/ScholarFormAI/
repo_url: https://github.com/rohitkumarnaidu/ScholarFormAI
repo_name: rohitkumarnaidu/ScholarFormAI
edit_uri: edit/main/docs/
docs_dir: .

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.share
    - search.suggest
    - content.tabs.link
    - content.code.copy
    - content.code.annotate
  font:
    text: Inter
    code: JetBrains Mono

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - toc:
      permalink: true
  - attr_list
  - md_in_html

copyright: Copyright &copy; 2026 ScholarFormAI — Automated Manuscript Formatter

