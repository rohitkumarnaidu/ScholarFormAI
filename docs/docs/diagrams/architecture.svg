<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3B82F6"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22C55E"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#F59E0B"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#A855F7"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="820" fill="#F8FAFC" rx="12"/>

  <!-- Title -->
  <text x="550" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1E293B">ScholarForm AI — System Architecture</text>

  <!-- ============================================ -->
  <!-- Tier labels -->
  <!-- ============================================ -->
  <text x="20" y="75" font-size="12" font-weight="600" fill="#3B82F6">CLIENT TIER</text>
  <text x="20" y="215" font-size="12" font-weight="600" fill="#22C55E">CDN / EDGE</text>
  <text x="20" y="355" font-size="12" font-weight="600" fill="#22C55E">BACKEND TIER</text>
  <text x="20" y="565" font-size="12" font-weight="600" fill="#F59E0B">DATA TIER</text>
  <text x="20" y="730" font-size="12" font-weight="600" fill="#A855F7">EXTERNAL SERVICES</text>

  <!-- ============================================ -->
  <!-- Browser -->
  <rect x="40" y="85" width="260" height="100" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" filter="url(#shadow)"/>
  <text x="170" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A8A">🌐 Browser</text>
  <text x="170" y="135" text-anchor="middle" font-size="11" fill="#3B82F6">Next.js 16 (App Router)</text>
  <text x="170" y="152" text-anchor="middle" font-size="11" fill="#3B82F6">React 19 · Server Components</text>
  <text x="170" y="169" text-anchor="middle" font-size="11" fill="#3B82F6">SSR · ISR · Turbopack Dev</text>

  <!-- Arrow: Browser → Vercel -->
  <line x1="300" y1="135" x2="370" y2="135" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

  <!-- ============================================ -->
  <!-- Vercel Edge -->
  <rect x="380" y="85" width="280" height="100" rx="10" fill="#ECFDF5" stroke="#22C55E" stroke-width="2" filter="url(#shadow)"/>
  <text x="520" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#14532D">▲ Vercel (Edge Network)</text>
  <text x="520" y="135" text-anchor="middle" font-size="11" fill="#166534">CDN · Edge Functions</text>
  <text x="520" y="152" text-anchor="middle" font-size="11" fill="#166534">Static Assets · API Proxy</text>
  <text x="520" y="169" text-anchor="middle" font-size="11" fill="#166534">Preview Deployments</text>

  <!-- Arrow: Vercel → FastAPI -->
  <line x1="660" y1="135" x2="730" y2="135" stroke="#22C55E" stroke-width="2.5" marker-end="url(#arrowGreen)"/>

  <!-- ============================================ -->
  <!-- FastAPI Backend -->
  <rect x="740" y="70" width="320" height="190" rx="12" fill="#ECFDF5" stroke="#22C55E" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="900" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#14532D">FastAPI Backend (Python 3.12)</text>
  <text x="900" y="118" text-anchor="middle" font-size="10" fill="#166534">uvicorn · Render Web Service</text>

  <!-- Internal boxes -->
  <rect x="760" y="132" width="140" height="50" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="830" y="152" text-anchor="middle" font-size="11" font-weight="600" fill="#14532D">API Routers</text>
  <text x="830" y="168" text-anchor="middle" font-size="10" fill="#166534">75 endpoints under /api/v1</text>

  <rect x="910" y="132" width="130" height="50" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="975" y="152" text-anchor="middle" font-size="11" font-weight="600" fill="#14532D">Auth &amp; Middleware</text>
  <text x="975" y="168" text-anchor="middle" font-size="10" fill="#166534">JWT · Rate Limit · CSRF</text>

  <rect x="760" y="190" width="140" height="50" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="830" y="210" text-anchor="middle" font-size="11" font-weight="600" fill="#14532D">Services Layer</text>
  <text x="830" y="226" text-anchor="middle" font-size="10" fill="#166534">27 service modules</text>

  <rect x="910" y="190" width="130" height="50" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="975" y="210" text-anchor="middle" font-size="11" font-weight="600" fill="#14532D">Pipeline</text>
  <text x="975" y="226" text-anchor="middle" font-size="10" fill="#166534">Formatter · Parser · Agent</text>

  <!-- Arrow: Backend → Data -->
  <line x1="900" y1="260" x2="900" y2="310" stroke="#22C55E" stroke-width="2.5" marker-end="url(#arrowOrange)"/>

  <!-- ============================================ -->
  <!-- Data Layer -->
  <rect x="40" y="320" width="1020" height="220" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2" filter="url(#shadow)"/>

  <!-- Redis -->
  <rect x="65" y="350" width="190" height="80" rx="8" fill="#FEF3C7" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="160" y="375" text-anchor="middle" font-size="13" font-weight="700" fill="#92400E">📦 Redis</text>
  <text x="160" y="395" text-anchor="middle" font-size="10" fill="#B45309">Pub/Sub · Cache · SSE</text>
  <text x="160" y="410" text-anchor="middle" font-size="10" fill="#B45309">Queue Backend</text>
  <text x="160" y="425" text-anchor="middle" font-size="10" fill="#B45309">Rate Limit Counters</text>

  <!-- Supabase -->
  <rect x="285" y="350" width="230" height="80" rx="8" fill="#FEF3C7" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="400" y="375" text-anchor="middle" font-size="13" font-weight="700" fill="#92400E">🗄️ Supabase PostgreSQL</text>
  <text x="400" y="395" text-anchor="middle" font-size="10" fill="#B45309">Primary DB · Storage</text>
  <text x="400" y="410" text-anchor="middle" font-size="10" fill="#B45309">User API Keys (encrypted)</text>
  <text x="400" y="425" text-anchor="middle" font-size="10" fill="#B45309">Generator Sessions</text>

  <!-- ChromaDB -->
  <rect x="545" y="350" width="200" height="80" rx="8" fill="#FEF3C7" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="645" y="375" text-anchor="middle" font-size="13" font-weight="700" fill="#92400E">🧠 ChromaDB</text>
  <text x="645" y="395" text-anchor="middle" font-size="10" fill="#B45309">Vector Store (RAG)</text>
  <text x="645" y="410" text-anchor="middle" font-size="10" fill="#B45309">Document Embeddings</text>
  <text x="645" y="425" text-anchor="middle" font-size="10" fill="#B45309">Semantic Search</text>

  <!-- Celery Worker -->
  <rect x="775" y="350" width="260" height="80" rx="8" fill="#FEF3C7" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="905" y="375" text-anchor="middle" font-size="13" font-weight="700" fill="#92400E">⚡ Celery Worker</text>
  <text x="905" y="395" text-anchor="middle" font-size="10" fill="#B45309">Async Task Queue</text>
  <text x="905" y="410" text-anchor="middle" font-size="10" fill="#B45309">Queues: interactive, batch</text>
  <text x="905" y="425" text-anchor="middle" font-size="10" fill="#B45309">Pipeline Orchestration</text>

  <!-- Data flow arrows -->
  <line x1="830" y1="260" x2="830" y2="310" stroke="#22C55E" stroke-width="2"/>
  <line x1="830" y1="310" x2="160" y2="310" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <line x1="830" y1="310" x2="400" y2="310" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <line x1="830" y1="310" x2="645" y2="310" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <line x1="830" y1="310" x2="905" y2="310" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- Backend metadata rectangles -->
  <rect x="230" y="445" width="200" height="40" rx="6" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1" stroke-dasharray="4"/>
  <text x="330" y="462" text-anchor="middle" font-size="10" fill="#92400E">Alembic Migrations</text>
  <text x="330" y="477" text-anchor="middle" font-size="10" fill="#B45309">Semantic Store (db/semantic_store)</text>

  <!-- Celery ←→ Backend -->
  <line x1="775" y1="390" x2="740" y2="390" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrowOrange)"/>
  <text x="750" y="383" text-anchor="end" font-size="9" fill="#B45309">tasks</text>

  <!-- Arrow: Data → External -->
  <line x1="330" y1="540" x2="330" y2="600" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <!-- ============================================ -->
  <!-- External Services -->
  <rect x="40" y="610" width="1020" height="190" rx="12" fill="#FAF5FF" stroke="#A855F7" stroke-width="2" filter="url(#shadow)"/>
  <text x="550" y="638" text-anchor="middle" font-size="14" font-weight="700" fill="#4C1D95">External Services (HuggingFace Spaces &amp; Providers)</text>

  <!-- GROBID -->
  <rect x="65" y="655" width="210" height="60" rx="8" fill="#F3E8FF" stroke="#D8B4FE" stroke-width="1.5"/>
  <text x="170" y="678" text-anchor="middle" font-size="12" font-weight="700" fill="#6B21A8">📄 GROBID</text>
  <text x="170" y="696" text-anchor="middle" font-size="10" fill="#7E22CE">PDF → TEI XML parsing</text>

  <!-- Docling -->
  <rect x="295" y="655" width="210" height="60" rx="8" fill="#F3E8FF" stroke="#D8B4FE" stroke-width="1.5"/>
  <text x="400" y="678" text-anchor="middle" font-size="12" font-weight="700" fill="#6B21A8">📝 Docling</text>
  <text x="400" y="696" text-anchor="middle" font-size="10" fill="#7E22CE">PDF → Markdown/JSON</text>

  <!-- OCR -->
  <rect x="525" y="655" width="210" height="60" rx="8" fill="#F3E8FF" stroke="#D8B4FE" stroke-width="1.5"/>
  <text x="630" y="678" text-anchor="middle" font-size="12" font-weight="700" fill="#6B21A8">🔍 OCR Engines</text>
  <text x="630" y="696" text-anchor="middle" font-size="10" fill="#7E22CE">Scanned doc text extraction</text>

  <!-- LLM Providers -->
  <rect x="755" y="655" width="280" height="60" rx="8" fill="#F3E8FF" stroke="#D8B4FE" stroke-width="1.5"/>
  <text x="895" y="678" text-anchor="middle" font-size="12" font-weight="700" fill="#6B21A8">🤖 LLM Providers</text>
  <text x="895" y="696" text-anchor="middle" font-size="10" fill="#7E22CE">NVIDIA NIM · Groq · DeepSeek · Ollama</text>

  <!-- LLM routing arrow -->
  <line x1="1000" y1="430" x2="1000" y2="540" stroke="#A855F7" stroke-width="1.5" stroke-dasharray="4"/>
  <line x1="1000" y1="540" x2="1000" y2="610" stroke="#A855F7" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <text x="1010" y="490" font-size="9" fill="#7E22CE">4-tier fallback chain</text>

  <!-- Legend -->
  <rect x="40" y="790" width="12" height="12" rx="2" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="58" y="801" font-size="10" fill="#475569">Client</text>
  <rect x="120" y="790" width="12" height="12" rx="2" fill="#ECFDF5" stroke="#22C55E" stroke-width="1.5"/>
  <text x="138" y="801" font-size="10" fill="#475569">Backend</text>
  <rect x="210" y="790" width="12" height="12" rx="2" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="228" y="801" font-size="10" fill="#475569">Data</text>
  <rect x="280" y="790" width="12" height="12" rx="2" fill="#FAF5FF" stroke="#A855F7" stroke-width="1.5"/>
  <text x="298" y="801" font-size="10" fill="#475569">External</text>
</svg>
