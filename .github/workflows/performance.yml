name: performance

on:
  schedule:
    - cron: '0 2 * * 0' # Run weekly on Sunday
  workflow_dispatch:

jobs:
  load-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start services
        run: docker compose up -d
      - name: Setup k6
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/performance/k6-script.js
