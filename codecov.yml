codecov:
  require_ci_to_pass: true
  max_report_age: 24
  notify:
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        target: 80%
        threshold: 1%
        base: auto
        flags:
          - backend
          - frontend
          - cli
          - sdk
        paths:
          - "backend/app/"
          - "cli/amf/"
          - "sdk/amf_sdk/"
          - "frontend/src/"
    patch:
      default:
        target: 80%
        threshold: 5%
        base: auto
    changes:
      default:
        enabled: true
        if_not_found: success

flags:
  backend:
    paths:
      - backend/
    carryforward: true
  frontend:
    paths:
      - frontend/
    carryforward: true
  cli:
    paths:
      - cli/
    carryforward: true
  sdk:
    paths:
      - sdk/
    carryforward: true

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
  require_base: true
  require_head: true
  hide_project_coverage: false

github_checks:
  annotations: true

parsers:
  gcov:
    branch_detection:
      conditional: yes
      loop: yes
      method: no
      macro: no

ignore:
  - "backend/tests/"
  - "cli/tests/"
  - "sdk/tests/"
  - "**/__init__.py"
  - "**/conftest.py"
  - "**/test_*.py"
  - "**/setup.py"
